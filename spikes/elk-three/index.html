<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Spike B: ELK + Three.js</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070b18;
        color: #dfe6ff;
        font-family: system-ui, "Hiragino Sans", sans-serif;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 40px;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 0 12px;
        font-size: 13px;
        z-index: 2;
      }
      #bar button {
        background: #1d2a4d;
        color: inherit;
        border: 1px solid #3a4c80;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
      }
      #log {
        margin-left: auto;
        opacity: 0.7;
      }
      .lbl {
        pointer-events: none;
      }
      .lbl > div {
        transform-origin: 50% 0;
        white-space: nowrap;
        font-size: 15px;
        text-shadow:
          0 0 6px #000,
          0 0 2px #000;
        padding-top: 34px;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="bar">
      <button id="enter">入る</button>
      <button id="back">戻る</button>
      <span id="crumb"></span>
      <span id="log"></span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
